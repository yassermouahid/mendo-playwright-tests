name: Playwright Tests

on:
  repository_dispatch:
    types: [run-tests]
  push:
    branches: ['*']

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEPLOYED_SHA: ${{ github.event.client_payload.deployed_sha }}
      APP_PIPELINE_URL: ${{ github.event.client_payload.app_pipeline_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: xvfb-run --auto-servernum npx playwright test --reporter=html

      - name: Save deployment metadata
        run: |
          if [ -n "$DEPLOYED_SHA" ]; then
            echo "Application project deployed SHA: $DEPLOYED_SHA" > playwright-report/deploy-info.txt
          else
            echo "Application project deployed SHA not provided" > playwright-report/deploy-info.txt
          fi
          
          if [ -n "$APP_PIPELINE_URL" ]; then
            echo "Application project pipeline URL: $APP_PIPELINE_URL" >> playwright-report/deploy-info.txt
          else
            echo "Application project pipeline URL not provided" >> playwright-report/deploy-info.txt
          fi

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
