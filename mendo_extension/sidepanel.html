<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup de l'Extension</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            width: 300px; /* Ajustez selon vos besoins */
        }
        h1 {
            color: #333;
            font-size: 24px;
        }
        p {
            color: #666;
            font-size: 14px;
        }
        .button-container {
            margin-top: 20px;
        }
        button {
            background-color: #008CBA; /* Couleur Bleu */
            border: none;
            color: white;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Bienvenue !</h1>
    <p>Cette popup peut contenir du texte, des liens, ou tout ce dont vous avez besoin.</p>
    <div class="button-container">
        <button id="open-options">Options</button>
        <button id="visit-site">Visitez notre Site</button>
    </div>

    <script src="sidepanel.js"></script>
</body>
</html>
