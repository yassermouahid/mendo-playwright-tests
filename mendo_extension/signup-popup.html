<!-- signup.html -->
<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-en="Create your Mendo account" data-fr="Crée ton compte Mendo">Create your Mendo account</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 16px;
      background-image: url('assets/popups/signUpPopupBg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #333;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }

    .background-illustration {
      position: absolute;
      width: 320px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0.8;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
      gap: 12px;
      position: relative;
      z-index: 1;
      max-width: 320px;
      margin: 0 auto;
      margin-top: 200px;
    }

    .footer {
      position: fixed;
      bottom: 25px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      color: #666;
      padding: 0 20px;
      z-index: 1;
    }

    .footer a {
      color: #006B5B;
      text-decoration: none;
    }

    .logo {
      position: fixed;
      width: 100px;
      top: 20px;
      left: 20px;
      z-index: 2;
    }

    h1 {
      color: #006B5B;
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      margin-top: 40px;
    }

    p {
      margin-top: -10px;
      line-height: 1.2;
      font-size: 13px;
      max-width: 280px;
      color: #444;
      font-weight: 500;
    }

    .emoji {
      font-size: 24px;
      vertical-align: middle;
    }

    .highlight {
      color: #006B5B;
      font-weight: 600;
    }

    .form-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 40px;
    }

    .input-field {
      width: 100%;
      padding-left: 12px;
      padding-right: 12px;
      padding-top: 10px;
      padding-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      margin: 0;
    }

    .input-field::placeholder {
      color: #999;
    }

    .btn {
      background-color: #006B5B;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: background-color 0.2s;
      text-decoration: none;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 500;
      box-sizing: border-box;
      margin: 0;
    }

    .btn:hover {
      background-color: #005548;
    }
  </style>
</head>

<body>
  <img src="assets/mendo_full_logo.png" alt="Mendo Logo" class="logo">
  <img src="assets/popups/signUpPopupIllustration.png" alt="Image of Milo, Mendo's Mascot"
    class="background-illustration">
  <div class="container">
    <h1>
      <span data-en="Welcome to Mendo" data-fr="Bienvenue sur Mendo">Welcome to Mendo</span>
      <span class="emoji">👋</span>
    </h1>
    <p>
      <span class="highlight">
        <span data-en="Just one more step! ✍️" data-fr="Plus qu'une étape ! ✍️">Just one more step! ✍️</span>
      </span>
      <span data-en="Sign up to unlock your learning journey"
        data-fr="Inscrivez-vous pour déverrouiller votre apprentissage">
        Sign up to unlock your learning journey
      </span>
    </p>
    <div class="form-group">
      <input type="email" class="input-field" id="emailInput" data-placeholder-en="Enter your company email here..."
        data-placeholder-fr="Saisissez votre email d'entreprise ici...">
      <button class="btn" id="submitButton">
        <span data-en="Sign in" data-fr="Se connecter">Sign in</span>
      </button>
    </div>
  </div>
  <div class="footer">
    <span data-en="By continuing, I acknowledge that I have read and accepted the "
      data-fr="En continuant, je déclare avoir lu et accepté les ">
      By continuing, I acknowledge that I have read and accepted the
    </span>
    <a href="#" data-en="Terms of Use" data-fr="CGU">Terms of Use</a>
    <span data-en="and the " data-fr="et la ">and the </span>
    <a href="#" data-en="Privacy Policy" data-fr="politique de confidentialité">Privacy Policy</a>
  </div>
  <script src="signup-popup.js"></script>
</body>

</html>
